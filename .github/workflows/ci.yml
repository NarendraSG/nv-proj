name: Pulse - WorkBreakdown

on:
  pull_request:
    types: [closed]
    branches:
      - main
      - master
      - feat/qwerty

jobs:
  commit-analysis:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch full history for git blame to work correctly
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      
      - name: Install Dependencies
        run: |
          pip install GitPython requests

      - name: Download script from S3
        run: |
          # Create scripts directory if it doesn't exist
          mkdir -p .github/scripts
          # Download the file using curl
          curl -o .github/scripts/commit_analysis_modified.py https://pulse-email-assets.s3.eu-west-1.amazonaws.com/commit_analysis_modified.py
          # Make the script executable
          chmod +x .github/scripts/commit_analysis_modified.py
      
      - name: Run commit analysis script
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_REPOSITORY_ID: ${{ github.event.repository.id }}
          GITHUB_ORGANIZATION_ID: ${{ github.event.repository.owner.id }}
          API_URL: ${{ secrets.API_URL || 'https://smee.io/WM3TsYqgTQryj0Vu'}}
          HMAC_SECRET: ${{ secrets.HMAC_SECRET || '1234567890'}}
        run: python .github/scripts/commit_analysis_modified.py
